<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="imagex/png" href="/Imagens/icone5.png">
    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <link rel="stylesheet" href="/css/minhadashboard.css">
</head>

<body>
    <div class="janela">
        <div class="header-left">

            <h1>Análises</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">

                <a href="quiz.html">
                    <h3>Quiz</h3>
                </a>

            </div>

            <div class="btn-nav-white">

                <a href="jogomemoria_login.html">
                    <h3>Jogo da Memória</h3>
                </a>

            </div>

            <div class="btn-nav-white">
                <a href="index_login.html">
                    <h3>Voltar</h3>
                </a>
            </div>

            <BR>

            <div class="btn-logout">
                <a href="index.html">
                    <h3>Logout</h3>
                </a>
            </div>

        </div>
    </div>

    <div class="conteudo">
        <div class="container">

            <div class="card1">
                <p>Vezes jogadas no Quiz: </p>
                <span id="totalJogadas"> </span>
            </div>

            <div class="card1">
                <p> Ultima pontuação atingida no Quiz:</p>
                <span id="ultimaPontuacao"></span>
            </div>

            <div class="card1">
                <p> Pontuação média no Quiz:</p>
                <span id="mediaPontuacao"></span>
            </div>

            <div class="card1">
                Vezes jogadas no jogo da Memória:</p>
                <span id="totalJogadasmemo"></span>
            </div>


            <div class="card1">
                Ultimo tempo atingido no jogo da memória:</p>
                <span id="ultimotempo"></span>
            </div>


            <div class="card1">
                <p> Tempo médio de conclusão no jogo da Memória:</p>
                <span id="mediamemoria"></span>
            </div>

        </div>

        <div class="grafico1">
        <canvas id="graficoquiz"></canvas>
        <canvas id="graficomememoria"></canvas>
        </div>

    </div>
    </div>
</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    var idUsuario = sessionStorage.ID_USUARIO;


    fetch(`/quiz/contarjogadas/${idUsuario}`)
        .then(res => res.json())
        .then(function (resposta) {
            var totalJogadas = document.getElementById('totalJogadas');
            totalJogadas.innerHTML = `${resposta[0].totaljogadas}`

        })

        .catch(erro => {
            console.error("Erro ao carregar dados", erro);
        });



    fetch(`/memoria/ultimotemporegis/${idUsuario}`)
        .then(res => res.json())
        .then(function (resposta) {
            var ultimotempouser = document.getElementById('ultimotempo');
            ultimotempouser.innerHTML = `${resposta[0].ultimotemporegis} Segundos`

        })

        .catch(erro => {
            console.error("Erro ao carregar dados", erro);
        });



    fetch(`/memoria/ultimapontuacaoregis/${idUsuario}`)
        .then(res => res.json())
        .then(function (resposta) {
            console.log(resposta)
            var ultimapontuacaouser = document.getElementById('ultimaPontuacao');
            ultimapontuacaouser.innerHTML = `${resposta[0].ultimapontuacao}`
        })

        .catch(erro => {
            console.error("Erro ao carregar dados", erro);
        });



    fetch(`/memoria/contarjogadasmemo/${idUsuario}`)
        .then(res => res.json())
        .then(function (resposta) {
            var totalJogadasmemo = document.getElementById('totalJogadasmemo');
            totalJogadasmemo.innerHTML = `${resposta[0].totaljogadasmemo}`

        })

        .catch(erro => {
            console.error("Erro ao carregar dados", erro);
        });



    fetch(`/memoria/mediamemoria/${idUsuario}`)
        .then(res => res.json())
        .then(function (resposta) {
            console.log(resposta)
            var mediatotalmemo = document.getElementById('mediamemoria');
            mediatotalmemo.innerHTML = `${resposta[0].tempomedio} Segundos`

        })

        .catch(erro => {
            console.error("Erro ao carregar dados", erro);
        });



    fetch(`/quiz/mediaPontuacaoes/${idUsuario}`)
        .then(res => res.json())
        .then(function (resposta) {
            console.log(resposta)
            var mediapontu = document.getElementById('mediaPontuacao');
            mediapontu.innerHTML = `${resposta[0].mediaPontuacao}`

        })

        .catch(erro => {
            console.error("Erro ao carregar dados", erro);
        });





    fetch(`/quiz/dados/${idUsuario}`)
        .then(res => {
            if (!res.ok) throw new Error("Erro na resposta do servidor");
            return res.json();
        })
        .then(data => {
            console.log("Dados recebidos:", data);

            new Chart(document.getElementById("graficoquiz"), {
                type: 'bar',
                data: {
                    labels: data.datas,
                    datasets: [
                        {
                            label: 'Suas Últimas Pontuações',
                            data: data.pontuacao,
                            backgroundColor: '#00CED1'
                        },
                        {
                            label: 'De outros Jogadores',
                            data: data.pontuacaoutros,
                            backgroundColor: '#96109b'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Pontuação'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Data da Jogada'
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Comparativo de Pontuações'
                        },
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        })
        .catch(error => {
            console.error("Erro ao carregar dados do gráfico:", error);
        });



fetch(`/memoria/mendados/${idUsuario}`)
        .then(res => {
            if (!res.ok) throw new Error("Erro na resposta do servidor");
            return res.json();
        })
        .then(data => {
            console.log("Dados recebidos:", data);

            new Chart(document.getElementById("graficomememoria"), {
                type: 'line',
                data: {
                    labels: data.datas,
                    datasets: [
                        {
                            label: 'Seus Últimos Tempos',
                            data: data.tempo,
                            backgroundColor: '#1E90FF'
                        },
                        {
                            label: 'De outros Jogadores',
                            data: data.tempoutros,
                            backgroundColor: '#96109b'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Tempo'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Data da Jogada'
                            }
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: 'Comparativo de Tempo'
                        },
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        })
        .catch(error => {
            console.error("Erro ao carregar dados do gráfico:", error);
        });

</script>
